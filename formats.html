<body>
<header class="wrap">
  <h1>Ting <em>Format Finder</em></h1>
  <p>Language-app videos that beat their account's usual views, each with a ready-to-make Ting version. Pick who you want to reach, and the hooks change to suit them.</p>
</header>
<div class="panel"><div class="wrap">
  <div class="row"><span class="label">Audience</span><span id="aud" class="row" style="margin:0"></span></div>
  <div class="row"><span class="label">Format</span><span id="fmt" class="row" style="margin:0"></span></div>
  <div class="row"><span class="label">Find</span><input id="q" type="search" placeholder="Search hooks, apps, languages" aria-label="Search">
    <select id="sort" aria-label="Sort"><option value="mult">Most above usual</option><option value="views">Most views</option><option value="er">Most engaged</option><option value="shares">Most shares</option><option value="saves">Most saves</option></select>
    <button id="make" class="chip" aria-pressed="false" title="Only show what Claude can make with no person on camera">Claude can make it</button>
    <button id="snd" class="chip" aria-pressed="false" title="Only show videos using a sound the poster didn't create">Reused sound</button>
    <button id="ads" class="chip" aria-pressed="false" title="Include videos marked as ads, or with low engagement for their views">Show likely paid</button></div>
</div></div>
<main class="wrap">
  <p id="audnote" class="aud-note"></p>
  <p id="count" class="count"></p>
  <div id="grid" class="grid"></div>
</main>
<footer class="wrap"><span id="foot"></span></footer>
<dialog id="d" aria-label="Video details"><div class="dlg"><div class="player" id="pl"></div><div class="detail" id="det"></div></div><button class="close" id="x" aria-label="Close">×</button></dialog>

  <div class="tags"><span class="tag">${esc(fname(p.pl.format))}</span><span class="tag ${p.pl.maker==='claude'?'ok':'ai'}">${p.pl.maker==='claude'?'Claude can make it':'Needs a real person'}</span>${p.sound.own?'':'<span class="tag">Reused sound</span>'}${p.ad?'<span class="tag warn">Marked as ad</span>':p.low?'<span class="tag warn">Low engagement</span>':''}${p.pl.untested?'<span class="tag">Untested</span>':''}</div></div></button>`}).join('')||'<p>Nothing matches. Try another filter.</p>';
 thumbs()}
function thumbs(){document.querySelectorAll('[data-thumb]').forEach(t=>{const u=DATA.thumbs&&DATA.thumbs[t.dataset.thumb];if(!u)return;const i=new Image();i.alt='';i.referrerPolicy='no-referrer';i.onload=()=>{t.prepend(i);t.classList.add('hasimg')};i.src=u})}
function fill(s,h){return esc(s).replaceAll('{hook}',esc(h))}
function open(id){const p=items.find(x=>x.id===id),pl=p.pl;let aud=st.aud;
 $('#pl').innerHTML=`<iframe title="Original TikTok" src="https://www.tiktok.com/player/v1/${id}?controls=1&loop=1" allow="fullscreen" loading="lazy"></iframe>`;
 const draw=()=>{const h=pl.hooks[aud];const m=mult(p);
 $('#det').innerHTML=`<h2>${esc(pl.name)}</h2><p>${esc(fname(pl.format))}. ${esc(pl.maker_note)}</p>
 <h3>The original</h3><p>"${esc(p.hook)}" by @${esc(p.handle)}, for ${esc(p.app)} (${esc(p.lang)}). <b>${num(p.views)}</b> views${m?`, <b>${m>=1000?num(m):m}x</b> this account's usual`:''}${p.shares?`, ${num(p.shares)} shares`:''}${p.saves?`, ${num(p.saves)} saves`:''}.${p.watched?'':' We\'ve read its numbers and caption, but haven\'t studied every frame.'}<a class="link" href="https://www.tiktok.com/@${esc(p.handle)}/${p.photo?'photo':'video'}/${id}" target="_blank" rel="noopener">Open on TikTok</a></p>
 ${p.ad?'<p><b>Paid warning:</b> TikTok marks this post as an ad, so its views may be paid for. Treat its numbers with care.</p>':p.low?`<p><b>Paid warning:</b> only ${p.er}% engagement for its views. It may have been boosted, though this isn't proof.</p>`:''}
 <h3>Sound</h3><p>${p.sound.own?"It uses the poster's own sound, so sound familiarity doesn't explain its reach.":`Reused sound: "${esc(p.sound.title)}" by ${esc(p.sound.by)}${p.sound.uses?`, used in ${esc(p.sound.uses)} videos`:''}. Viewers may recognise it. For your version, pick a sound that's popular on the day. Business accounts can only use TikTok's commercial library.`}</p>
 <h3>Why it works</h3><p>${esc(pl.why)}</p>
 <h3>Ting's version</h3><div class="tabs" id="dt">${DATA.audiences.map(a=>`<button class="chip" data-v="${a.id}" aria-pressed="${a.id===aud}">${esc(a.name)}</button>`).join('')}</div>
 <div class="hookbox">${esc(h)}</div>
 <ol class="beats">${pl.beats.map(b=>`<li><span class="k">Show</span>${fill(b.show,h)}<span class="k">On-screen text</span>${fill(b.text,h)}<span class="k">Say</span>${fill(b.say,h)}</li>`).join('')}</ol>
 <button class="copy" id="cp">Copy this brief</button>`;
 $('#dt').onclick=e=>{const b=e.target.closest('.chip');if(b){aud=b.dataset.v;draw()}};
 $('#cp').onclick=e=>{const t=`${pl.name} (${fname(pl.format)})\nHook: ${h}\nOriginal: https://www.tiktok.com/@${p.handle}/video/${id}\n\n`+pl.beats.map((b,i)=>`${i+1}. Show: ${b.show}\n   Text: ${b.text}\n   Say: ${b.say}`.replaceAll('{hook}',h)).join('\n')+`\n\nOnly say what's true for you. Keep your paid partnership label on.`;navigator.clipboard?.writeText(t).then(()=>{e.target.textContent='Copied'},()=>{e.target.textContent='Copy failed'})}};
 draw();$('#d').showModal()}
chips($('#aud'),DATA.audiences,'aud');chips($('#fmt'),[{id:'all',name:'All'},...DATA.formats],'fmt');
$('#q').oninput=e=>{st.q=e.target.value;render()};$('#sort').onchange=e=>{st.sort=e.target.value;render()};
$('#make').onclick=e=>{st.make=!st.make;e.currentTarget.setAttribute('aria-pressed',st.make);render()};
$('#snd').onclick=e=>{st.snd=!st.snd;e.currentTarget.setAttribute('aria-pressed',st.snd);render()};
$('#ads').onclick=e=>{st.ads=!st.ads;e.currentTarget.setAttribute('aria-pressed',st.ads);render()};
$('#grid').onclick=e=>{const c=e.target.closest('.card');if(c)open(c.dataset.id)};
const close=()=>{$('#d').close()};$('#x').onclick=close;$('#d').onclick=e=>{if(e.target===$('#d'))close()};$('#d').addEventListener('close',()=>{$('#pl').innerHTML=''});
$('#foot').textContent=`Public TikTok numbers, read ${DATA.collected}. "x" compares a video with the median of that account's recent posts, so a low median makes it look bigger. "Engaged" is likes, comments, shares and saves as a share of views. Posts TikTok marks as ads, or under 5% engaged, are hidden unless you choose "Show likely paid". This shows what has won, not how often a format fails.`;
render();
</script>
